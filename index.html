<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Futbol Analiz</title>
<style>
:root{
  --bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;--border:#2e3250;
  --accent:#4f8aff;--accent2:#7c5fff;--green:#22c55e;--red:#ef4444;
  --yellow:#f59e0b;--text:#e8eaf6;--muted:#8892b0;
  --card:#1e2235;--radius:12px;
}
[data-theme="light"]{
  --bg:#f0f2fa;--bg2:#fff;--bg3:#e8ebf5;--border:#c5cae9;
  --text:#1a1d2e;--muted:#4a5568;--card:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:inherit}

/* LAYOUT */
.app{display:grid;grid-template-rows:56px 1fr;min-height:100vh}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:16px;position:sticky;top:0;z-index:100}
.logo{font-size:1.15rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.topbar-tabs{display:flex;gap:4px;margin-left:8px}
.tab-btn{background:none;border:none;color:var(--muted);padding:6px 14px;border-radius:8px;
  font-size:.88rem;font-weight:500;transition:.2s}
.tab-btn.active,.tab-btn:hover{background:var(--bg3);color:var(--text)}
.tab-btn.active{color:var(--accent)}
.theme-btn{margin-left:auto;background:var(--bg3);border:none;color:var(--text);
  padding:6px 12px;border-radius:8px;font-size:.85rem}

.main{display:grid;grid-template-columns:280px 1fr;overflow:hidden;height:calc(100vh - 56px)}
.sidebar{background:var(--bg2);border-right:1px solid var(--border);
  overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.content{overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card-title{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.6px;
  color:var(--muted);margin-bottom:12px}

/* SEARCH */
.search-wrap{position:relative}
.search-input{width:100%;background:var(--bg3);border:1px solid var(--border);
  color:var(--text);border-radius:8px;padding:8px 12px;font-size:.9rem;outline:none}
.search-input:focus{border-color:var(--accent)}
.dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg2);
  border:1px solid var(--border);border-radius:8px;z-index:200;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.4)}
.dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;transition:.15s}
.dropdown-item:hover{background:var(--bg3)}
.dropdown-item img{width:26px;height:26px;object-fit:contain;border-radius:4px}
.team-name{font-size:.9rem;font-weight:500}
.team-country{font-size:.75rem;color:var(--muted)}

/* SELECTED TEAMS */
.vs-bar{display:flex;align-items:center;gap:8px;background:var(--bg3);
  border-radius:var(--radius);padding:12px}
.vs-team{display:flex;flex-direction:column;align-items:center;flex:1;gap:4px}
.vs-team img{width:40px;height:40px;object-fit:contain}
.vs-team .vs-name{font-size:.8rem;font-weight:600;text-align:center}
.vs-sep{font-size:1.2rem;font-weight:700;color:var(--muted)}

/* ODDS INPUTS */
.odds-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.odds-inp{background:var(--bg3);border:1px solid var(--border);color:var(--text);
  border-radius:6px;padding:7px 8px;font-size:.85rem;text-align:center;outline:none;width:100%}
.odds-inp:focus{border-color:var(--accent)}
.odds-label{font-size:.72rem;color:var(--muted);text-align:center;margin-bottom:2px}

/* ANALYZE BTN */
.analyze-btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;color:#fff;border-radius:8px;padding:11px;font-size:.95rem;font-weight:600;
  transition:.2s;letter-spacing:.3px}
.analyze-btn:hover{opacity:.88;transform:translateY(-1px)}
.analyze-btn:disabled{opacity:.4;transform:none;cursor:not-allowed}

/* LEAGUE SELECTOR */
.league-sel{width:100%;background:var(--bg3);border:1px solid var(--border);
  color:var(--text);border-radius:8px;padding:8px 10px;font-size:.85rem;outline:none}

/* PROBABILITY BARS */
.prob-section{display:flex;flex-direction:column;gap:10px}
.prob-row{display:flex;flex-direction:column;gap:4px}
.prob-meta{display:flex;justify-content:space-between;align-items:center}
.prob-label{font-size:.85rem;font-weight:500}
.prob-val{font-size:.9rem;font-weight:700}
.bar-track{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .6s ease}
.bar-blue{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.bar-gray{background:var(--muted)}
.bar-orange{background:linear-gradient(90deg,#f59e0b,#ef4444)}
.bar-green{background:var(--green)}
.bar-red{background:var(--red)}

/* 1X2 BIG DISPLAY */
.result-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.result-box{background:var(--bg3);border-radius:10px;padding:14px 8px;text-align:center;
  border:2px solid transparent;transition:.2s}
.result-box.best{border-color:var(--accent)}
.result-box .rb-label{font-size:.8rem;color:var(--muted);margin-bottom:4px}
.result-box .rb-val{font-size:1.6rem;font-weight:700}
.result-box .rb-xg{font-size:.75rem;color:var(--muted);margin-top:2px}

/* XG DISPLAY */
.xg-row{display:flex;justify-content:center;align-items:center;gap:24px;
  background:var(--bg3);border-radius:10px;padding:12px;margin-bottom:12px}
.xg-side{text-align:center}
.xg-side .xg-lbl{font-size:.75rem;color:var(--muted)}
.xg-side .xg-num{font-size:1.8rem;font-weight:700;color:var(--accent)}
.xg-vs{font-size:.9rem;color:var(--muted)}

/* TOP SCORES */
.score-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.score-item{background:var(--bg3);border-radius:8px;padding:8px 6px;text-align:center}
.score-item .si-score{font-size:.95rem;font-weight:700}
.score-item .si-prob{font-size:.72rem;color:var(--muted)}

/* MATRIX 5x5 */
.matrix-wrap{overflow-x:auto}
.matrix-table{border-collapse:collapse;font-size:.8rem;width:100%}
.matrix-table th,.matrix-table td{padding:6px 8px;text-align:center;border:1px solid var(--border)}
.matrix-table th{background:var(--bg3);color:var(--muted);font-weight:600}
.matrix-table td{transition:background .2s}

/* STATS TABLE */
.stats-split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-box{background:var(--bg3);border-radius:10px;padding:12px}
.stat-box-title{font-size:.75rem;color:var(--muted);margin-bottom:8px;font-weight:600;text-transform:uppercase}
.stat-row{display:flex;justify-content:space-between;padding:4px 0;
  border-bottom:1px solid var(--border);font-size:.85rem}
.stat-row:last-child{border-bottom:none}
.stat-val{font-weight:600}

/* FORM PILLS */
.form-pills{display:flex;gap:4px;flex-wrap:wrap}
.pill{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:700;flex-shrink:0}
.pill-W{background:#166534;color:#4ade80}
.pill-D{background:#1e3a5f;color:#60a5fa}
.pill-L{background:#7f1d1d;color:#f87171}

/* H2H TABLE */
.h2h-table{width:100%;border-collapse:collapse;font-size:.83rem}
.h2h-table th{text-align:left;padding:6px 8px;color:var(--muted);
  font-size:.72rem;text-transform:uppercase;border-bottom:1px solid var(--border)}
.h2h-table td{padding:8px 8px;border-bottom:1px solid var(--border)}
.h2h-table tr:last-child td{border-bottom:none}
.score-badge{background:var(--bg3);border-radius:6px;padding:2px 8px;font-weight:700;font-size:.85rem}

/* ODDS ANALYSIS */
.odds-cards{display:flex;flex-direction:column;gap:8px}
.odds-card{border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;
  border:1px solid var(--border);background:var(--bg3)}
.odds-card.value{border-color:var(--green);background:rgba(34,197,94,.07)}
.odds-card.overpriced{border-color:var(--red);background:rgba(239,68,68,.07)}
.odds-card.fair{border-color:var(--accent);background:rgba(79,138,255,.07)}
.oc-label{flex:1;font-weight:600;font-size:.9rem}
.oc-meta{display:flex;gap:16px;font-size:.82rem}
.oc-meta span{color:var(--muted)}
.oc-meta strong{color:var(--text)}
.oc-verdict{font-weight:700;font-size:.85rem;white-space:nowrap}
.oc-verdict.value{color:var(--green)}
.oc-verdict.overpriced{color:var(--red)}
.oc-verdict.fair{color:var(--accent)}

/* RECENT MATCHES */
.matches-list{display:flex;flex-direction:column;gap:6px}
.match-row{display:flex;align-items:center;gap:10px;padding:8px 10px;
  background:var(--bg3);border-radius:8px;font-size:.83rem}
.match-row .mr-date{color:var(--muted);width:72px;flex-shrink:0}
.match-row .mr-teams{flex:1}
.match-row .mr-score{font-weight:700;width:44px;text-align:center}
.mr-venue{font-size:.72rem;padding:2px 6px;border-radius:4px;font-weight:600;
  background:var(--bg);color:var(--muted);flex-shrink:0}

/* LIVE */
.live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.live-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;display:flex;flex-direction:column;gap:8px}
.live-header{display:flex;justify-content:space-between;align-items:center}
.live-league{font-size:.72rem;color:var(--muted)}
.live-min{font-size:.72rem;font-weight:700;color:var(--red);
  background:rgba(239,68,68,.15);padding:2px 6px;border-radius:4px}
.live-teams{display:flex;justify-content:space-between;align-items:center;gap:8px}
.live-team{display:flex;align-items:center;gap:6px;flex:1;font-size:.88rem;font-weight:600}
.live-team img{width:22px;height:22px;object-fit:contain}
.live-score{font-size:1.3rem;font-weight:800;text-align:center;min-width:44px}
.live-score.home-ahead{color:var(--green)}
.live-score.away-ahead{color:var(--red)}

/* UPCOMING */
.upcoming-list{display:flex;flex-direction:column;gap:6px}
.upc-row{background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:.15s}
.upc-row:hover{border-color:var(--accent);background:var(--bg3)}
.upc-date{font-size:.78rem;color:var(--muted);width:88px;flex-shrink:0}
.upc-home,.upc-away{display:flex;align-items:center;gap:6px;font-size:.87rem;font-weight:500}
.upc-home{flex:1;justify-content:flex-end}
.upc-away{flex:1}
.upc-home img,.upc-away img{width:22px;height:22px;object-fit:contain}
.upc-vs{font-size:.78rem;color:var(--muted);padding:0 6px}

/* SPINNER */
.spinner{width:32px;height:32px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:24px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* TABS inside content */
.inner-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.inner-tab{background:none;border:none;color:var(--muted);padding:8px 14px;
  font-size:.85rem;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.inner-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.inner-panel{display:none}
.inner-panel.active{display:block}

.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:.9rem}
.badge-live{background:var(--red);color:#fff;font-size:.65rem;font-weight:700;
  padding:2px 6px;border-radius:4px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* OVER/UNDER GRID */
.ou-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ou-item{background:var(--bg3);border-radius:8px;padding:10px 12px;text-align:center}
.ou-label{font-size:.75rem;color:var(--muted);margin-bottom:2px}
.ou-val{font-size:1.2rem;font-weight:700}
.ou-val.high{color:var(--green)}
.ou-val.low{color:var(--red)}

/* Responsive */
@media(max-width:768px){
  .main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .sidebar{height:auto;border-right:none;border-bottom:1px solid var(--border)}
  .stats-split{grid-template-columns:1fr}
  .result-grid{gap:6px}
}
</style>
</head>
<body>
<div class="app">
  <!-- TOPBAR -->
  <header class="topbar">
    <div class="logo">⚽ Futbol Analiz</div>
    <div class="topbar-tabs">
      <button class="tab-btn active" onclick="switchTab('analyze')">Analiz</button>

      <div class="card">

      <!-- AWAY TEAM -->

        <div class="vs-team" id="vs-home">

          <span class="vs-name" id="vs-home-name"></span>
        </div>
        <span class="vs-sep">VS</span>
        <div class="vs-team" id="vs-away">
          <img src="" id="vs-away-img" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><circle cx=%2220%22 cy=%2220%22 r=%2220%22 fill=%22%232e3250%22/></svg>'">

      <!-- ODDS -->
      <div class="card">

          <div>
            <div class="odds-label">Ev (1)</div>
            <input class="odds-inp" id="odds-home" type="number" step="0.01" min="1" placeholder="2.10">
          </div>
          <div>

            <option value="693">2. Liga</option>
          </optgroup>
          <optgroup label="🇩🇰 Danimarka">
            <option value="573">Superliga</option>

          </optgroup>
          <optgroup label="🇸🇪 İsveç">

          </optgroup>
          <optgroup label="🇵🇱 Polonya">
            <option value="202">Ekstraklasa</option>
          </optgroup>

          </optgroup>

            <option value="325">Serie A</option>

          </optgroup>
        </select>
      </div>
    </aside>

    <!-- CONTENT -->
    <main class="content" id="content">
      <div id="tab-analyze">
        <div id="placeholder" class="empty">
          <div style="font-size:3rem;margin-bottom:12px">⚽</div>
          <div>İki takım seçip <strong>Analiz Et</strong>'e basın.</div>
          <div style="margin-top:8px;font-size:.82rem">Poisson modeli + 5 yıllık veri analizi</div>
        </div>
        <div id="loading" style="display:none"><div class="spinner"></div><div style="text-align:center;color:var(--muted);font-size:.88rem">Veriler çekiliyor, Poisson hesaplanıyor…</div></div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
const state = {home: null, away: null};
let searchTimers = {};

// Auto-detect backend URL (same origin in production, localhost in dev)
const API = '';
const API = '';
  : window.location.origin;

// ─── Theme ───────────────────────────────────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const cur = html.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  document.querySelector('.theme-btn').textContent = next === 'dark' ? '🌙' : '☀️';
  try { localStorage.setItem('fa_theme', next); } catch(e){}
}
try {
  const saved = localStorage.getItem('fa_theme');
  if (saved) {
    document.documentElement.setAttribute('data-theme', saved);
    if (saved === 'light') document.querySelector('.theme-btn').textContent = '☀️';
  }
} catch(e) {}

// ─── Tab switching ───────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', ['analyze','upcoming','live'][i] === name);
  });
  ['analyze','upcoming','live'].forEach(t => {
    document.getElementById('tab-'+t).style.display = t === name ? 'block' : 'none';
  });
  document.getElementById('sidebar-league').style.display = name === 'upcoming' ? 'block' : 'none';
  if (name === 'live') loadLive();
}

// ─── Team Search ─────────────────────────────────────────────────────────────
function debouncedSearch(side, val) {
  clearTimeout(searchTimers[side]);
  const dd = document.getElementById(side+'-dd');
  if (val.length < 2) { dd.style.display = 'none'; return; }
  searchTimers[side] = setTimeout(() => searchTeams(side, val), 300);
}

async function searchTeams(side, q) {
  const dd = document.getElementById(side+'-dd');
  dd.innerHTML = '<div style="padding:10px;color:var(--muted);font-size:.85rem">Aranıyor…</div>';
  dd.style.display = 'block';
  try {
    const res = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`);
    const teams = await res.json();
    if (!teams.length) {
      dd.innerHTML = '<div style="padding:10px;color:var(--muted);font-size:.85rem">Sonuç yok</div>';
      return;
    }
    dd.innerHTML = teams.map(t => `
      <div class="dropdown-item" onclick="selectTeam('${side}',${JSON.stringify(t).replace(/'/g,"&#39;")})">
        <img src="${t.logo}" onerror="this.style.display='none'">
        <div><div class="team-name">${t.name}</div><div class="team-country">${t.country}</div></div>
      </div>
    `).join('');
  } catch(e) {
    dd.innerHTML = '<div style="padding:10px;color:var(--red);font-size:.85rem">Bağlantı hatası</div>';
  }
}

function selectTeam(side, team) {
  state[side] = team;
  document.getElementById(side+'-search').value = team.name;
  document.getElementById(side+'-dd').style.display = 'none';
  updateVsBar();
  checkReady();
}

function updateVsBar() {
  const bar = document.getElementById('vs-bar');
  if (state.home || state.away) {
    bar.style.display = 'flex';
    if (state.home) {
      document.getElementById('vs-home-img').src = state.home.logo;
      document.getElementById('vs-home-name').textContent = state.home.shortName || state.home.name;
    }
    if (state.away) {
      document.getElementById('vs-away-img').src = state.away.logo;
      document.getElementById('vs-away-name').textContent = state.away.shortName || state.away.name;
    }
  }
}

function checkReady() {
  document.getElementById('analyze-btn').disabled = !(state.home && state.away);
}

// Close dropdowns on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) {
    document.querySelectorAll('.dropdown').forEach(d => d.style.display = 'none');
  }
});

// ─── Analysis ────────────────────────────────────────────────────────────────
async function runAnalysis() {
  if (!state.home || !state.away) return;
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('loading').style.display = 'block';

  const ho = document.getElementById('odds-home').value;
  const do_ = document.getElementById('odds-draw').value;
  const ao = document.getElementById('odds-away').value;

  try {
    const params = new URLSearchParams({
      home_id: state.home.id,
      away_id: state.away.id,
      ...(ho && {home_odds: ho}),
      ...(do_ && {draw_odds: do_}),
      ...(ao && {away_odds: ao}),
    });
    const res = await fetch(`${API}/api/analyze?${params}`);
    const data = await res.json();
    renderResults(data);
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('results').innerHTML = `<div class="empty">❌ Bağlantı hatası: ${e.message}</div>`;
    document.getElementById('results').style.display = 'block';
  }
}

function renderResults(d) {
  document.getElementById('loading').style.display = 'none';
  const el = document.getElementById('results');
  el.style.display = 'block';

  const p = d.poisson;
  const best1x2 = Math.max(p.home_win, p.draw, p.away_win);

  // Color helpers
  const barC = (pct) => pct >= 55 ? 'bar-blue' : pct >= 45 ? 'bar-gray' : 'bar-orange';
  const ouC  = (pct) => pct >= 50 ? 'high' : 'low';

  // Form pills
  function pills(results) {
    if (!results || !results.length) return '<span style="color:var(--muted);font-size:.8rem">Veri yok</span>';
    return results.slice(0,15).map(r =>
      `<span class="pill pill-${r}">${r}</span>`
    ).join('');
  }

  // Stat box helper
  function statBox(title, stats) {
    if (!stats || !stats.matches) return `<div class="stat-box"><div class="stat-box-title">${title}</div><div style="color:var(--muted);font-size:.82rem">Veri yok</div></div>`;
    return `
    <div class="stat-box">
      <div class="stat-box-title">${title}</div>
      <div class="stat-row"><span>Maç</span><span class="stat-val">${stats.matches}</span></div>
      <div class="stat-row"><span>Gol/Maç (Atılan)</span><span class="stat-val">${stats.avg_scored}</span></div>
      <div class="stat-row"><span>Gol/Maç (Yenilen)</span><span class="stat-val">${stats.avg_conceded}</span></div>
      <div class="stat-row"><span>G / B / M</span><span class="stat-val">${stats.wins} / ${stats.draws} / ${stats.losses}</span></div>
      <div style="margin-top:8px"><div style="font-size:.72rem;color:var(--muted);margin-bottom:4px">Son Form</div>
      <div class="form-pills">${pills(stats.results)}</div></div>
    </div>`;
  }

  // Recent match rows
  function recentRows(matches, teamId) {
    if (!matches || !matches.length) return '<div style="color:var(--muted);font-size:.82rem;padding:8px">Veri yok</div>';
    return matches.map(m => `
      <div class="match-row">
        <span class="mr-date">${m.date}</span>
        <span class="mr-teams">${m.home} <strong>${m.score}</strong> ${m.away}</span>
        <span class="pill pill-${m.result}" style="width:auto;border-radius:4px;padding:2px 6px">${m.result}</span>
        <span class="mr-venue">${m.is_home ? 'İç' : 'Dep'}</span>
      </div>`).join('');
  }

  // H2H rows
  function h2hRows(h2h) {
    if (!h2h || !h2h.length) return '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:16px">H2H verisi bulunamadı</td></tr>';
    return h2h.map(m => {
      const isHome = m.home_id === state.home.id;
      const res = isHome
        ? (parseInt(m.score) > parseInt(m.score.split('-')[1]) ? 'W' : m.score.split('-')[0]===m.score.split('-')[1] ? 'D' : 'L')
        : '?';
      return `<tr>
        <td>${m.date}</td>
        <td style="text-align:right">${m.home}</td>
        <td style="text-align:center"><span class="score-badge">${m.score}</span></td>
        <td>${m.away}</td>
      </tr>`;
    }).join('');
  }

  // Odds analysis
  function oddsCards(odds) {
    if (!odds || !odds.length) return '<div class="empty" style="padding:16px">Oran girilmedi veya veri yok.</div>';
    return odds.map(o => `
      <div class="odds-card ${o.cls}">
        <div class="oc-label">${o.label}</div>
        <div class="oc-meta">
          <span>Oran: <strong>${o.odds}</strong></span>
          <span>Zımni: <strong>%${o.implied_pct}</strong></span>
          <span>Model: <strong>%${o.model_pct.toFixed(1)}</strong></span>
          <span>Fark: <strong>${o.edge > 0 ? '+' : ''}${o.edge}%</strong></span>
        </div>
        <div class="oc-verdict ${o.cls}">${o.verdict}</div>
      </div>`).join('');
  }

  // Matrix coloring
  function matrixCell(val) {
    const alpha = Math.min(val / 15, 1);
    return `style="background:rgba(79,138,255,${alpha.toFixed(2)})"`;
  }

  el.innerHTML = `
  <!-- XG + 1X2 -->
  <div class="card">
    <div class="card-title">Beklenen Goller (xG)</div>
    <div class="xg-row">
      <div class="xg-side">
        <div class="xg-lbl">${d.home.shortName || d.home.name}</div>
        <div class="xg-num">${p.home_xg}</div>
      </div>
      <div class="xg-vs">vs</div>
      <div class="xg-side">
        <div class="xg-lbl">${d.away.shortName || d.away.name}</div>
        <div class="xg-num">${p.away_xg}</div>
      </div>
    </div>

    <div class="result-grid">
      <div class="result-box ${p.home_win === best1x2 ? 'best' : ''}">
        <div class="rb-label">Ev Sahibi (1)</div>
        <div class="rb-val">%${p.home_win}</div>
      </div>
      <div class="result-box ${p.draw === best1x2 ? 'best' : ''}">
        <div class="rb-label">Beraberlik (X)</div>
        <div class="rb-val">%${p.draw}</div>
      </div>
      <div class="result-box ${p.away_win === best1x2 ? 'best' : ''}">
        <div class="rb-label">Deplasman (2)</div>
        <div class="rb-val">%${p.away_win}</div>
      </div>
    </div>

    <div class="prob-section">
      <div class="prob-row">
        <div class="prob-meta"><span class="prob-label">${d.home.name}</span><span class="prob-val">%${p.home_win}</span></div>
        <div class="bar-track"><div class="bar-fill bar-blue" style="width:${p.home_win}%"></div></div>
      </div>
      <div class="prob-row">
        <div class="prob-meta"><span class="prob-label">Beraberlik</span><span class="prob-val">%${p.draw}</span></div>
        <div class="bar-track"><div class="bar-fill bar-gray" style="width:${p.draw}%"></div></div>
      </div>
      <div class="prob-row">
        <div class="prob-meta"><span class="prob-label">${d.away.name}</span><span class="prob-val">%${p.away_win}</span></div>
        <div class="bar-track"><div class="bar-fill bar-orange" style="width:${p.away_win}%"></div></div>
      </div>
    </div>
  </div>

  <!-- İÇ TABS -->
  <div class="card">
    <div class="inner-tabs">
      <button class="inner-tab active" onclick="innerTab('ou')">Alt/Üst & KG</button>
      <button class="inner-tab" onclick="innerTab('scores')">Skor Tahminleri</button>
      <button class="inner-tab" onclick="innerTab('matrix')">Skor Matrisi</button>
      ${d.odds_analysis && d.odds_analysis.length ? '<button class="inner-tab" onclick="innerTab(\'odds\')">Oran Analizi</button>' : ''}
    </div>

    <div id="panel-ou" class="inner-panel active">
      <div class="ou-grid">
        <div class="ou-item"><div class="ou-label">Üst 1.5</div><div class="ou-val ${ouC(p.over15)}">%${p.over15}</div></div>
        <div class="ou-item"><div class="ou-label">Alt 1.5</div><div class="ou-val ${ouC(p.under15)}">%${p.under15}</div></div>
        <div class="ou-item"><div class="ou-label">Üst 2.5</div><div class="ou-val ${ouC(p.over25)}">%${p.over25}</div></div>
        <div class="ou-item"><div class="ou-label">Alt 2.5</div><div class="ou-val ${ouC(p.under25)}">%${p.under25}</div></div>
        <div class="ou-item"><div class="ou-label">Üst 3.5</div><div class="ou-val ${ouC(p.over35)}">%${p.over35}</div></div>
        <div class="ou-item"><div class="ou-label">Alt 3.5</div><div class="ou-val ${ouC(p.under35)}">%${p.under35}</div></div>
        <div class="ou-item"><div class="ou-label">Üst 4.5</div><div class="ou-val ${ouC(p.over45)}">%${p.over45}</div></div>
        <div class="ou-item"><div class="ou-label">Alt 4.5</div><div class="ou-val ${ouC(p.under45)}">%${p.under45}</div></div>
        <div class="ou-item"><div class="ou-label">KG Var</div><div class="ou-val ${ouC(p.btts)}">%${p.btts}</div></div>
        <div class="ou-item"><div class="ou-label">KG Yok</div><div class="ou-val ${ouC(p.no_btts)}">%${p.no_btts}</div></div>
      </div>
    </div>

    <div id="panel-scores" class="inner-panel">
      <div class="score-grid">
        ${(p.top_scores || []).map(s =>
          `<div class="score-item"><div class="si-score">${s.home}-${s.away}</div><div class="si-prob">%${s.prob}</div></div>`
        ).join('')}
      </div>
    </div>

    <div id="panel-matrix" class="inner-panel">
      <div class="matrix-wrap">
        <table class="matrix-table">
          <thead>
            <tr>
              <th>${d.home.shortName || d.home.name} ↓ / ${d.away.shortName || d.away.name} →</th>
              ${[0,1,2,3,4].map(j => `<th>Dep ${j}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${(p.matrix_5x5 || []).map((row, i) => `
              <tr>
                <th>Ev ${i}</th>
                ${row.map(v => `<td ${matrixCell(v)}>%${v}</td>`).join('')}
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>

    ${d.odds_analysis && d.odds_analysis.length ? `
    <div id="panel-odds" class="inner-panel">
      <div class="odds-cards">${oddsCards(d.odds_analysis)}</div>
    </div>` : ''}
  </div>

  <!-- İSTATİSTİKLER -->
  <div class="card">
    <div class="card-title">${d.home.name} — İstatistikler</div>
    <div class="stats-split">
      ${statBox('İç Saha', d.home_stats?.home)}
      ${statBox('Genel', d.home_stats?.all)}
    </div>
  </div>

  <div class="card">
    <div class="card-title">${d.away.name} — İstatistikler</div>
    <div class="stats-split">
      ${statBox('Deplasman', d.away_stats?.away)}
      ${statBox('Genel', d.away_stats?.all)}
    </div>
  </div>

  <!-- SON MAÇLAR -->
  <div class="card">
    <div class="card-title">${d.home.name} — Son Maçlar</div>
    <div class="matches-list">${recentRows(d.home_recent)}</div>
  </div>
  <div class="card">
    <div class="card-title">${d.away.name} — Son Maçlar</div>
    <div class="matches-list">${recentRows(d.away_recent)}</div>
  </div>

  <!-- H2H -->
  <div class="card">
    <div class="card-title">Karşılıklı Maçlar (H2H)</div>
    <table class="h2h-table">
      <thead><tr><th>Tarih</th><th style="text-align:right">Ev</th><th style="text-align:center">Skor</th><th>Deplasman</th></tr></thead>
      <tbody>${h2hRows(d.h2h)}</tbody>
    </table>
  </div>

  ${d.odds_analysis && d.odds_analysis.length ? `
  <!-- ORAN ANALİZİ (ALT BÖLÜM) -->
  <div class="card">
    <div class="card-title">Oran Analizi (Değer Bahis Tespiti)</div>
    <div class="odds-cards">${oddsCards(d.odds_analysis)}</div>
    <div style="margin-top:12px;font-size:.78rem;color:var(--muted)">
      ▲ Değerli: Model oranı, bahisçi oranının 5+ puan üzerinde ·
      ▼ Pahalı: Bahisçi oranı, modelin 5+ puan üzerinde ·
      ≈ Adil: ±5 puan aralığında
    </div>
  </div>` : ''}
  `;

  // Activate first inner tab
  document.querySelectorAll('.inner-tab')[0]?.click();
}

function innerTab(name) {
  document.querySelectorAll('.inner-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.inner-panel').forEach(p => p.classList.remove('active'));
  // Find clicked button
  event.target.classList.add('active');
  const panel = document.getElementById('panel-'+name);
  if (panel) panel.classList.add('active');
}

// ─── Upcoming ─────────────────────────────────────────────────────────────────
async function loadUpcoming() {
  const leagueId = document.getElementById('league-sel').value;
  const el = document.getElementById('upcoming-content');
  el.innerHTML = '<div class="spinner"></div>';
  try {
    const res = await fetch(`${API}/api/upcoming/${leagueId}`);
    const events = await res.json();
    if (!events.length) {
      el.innerHTML = '<div class="empty">Bu lig için yaklaşan maç bulunamadı.</div>';
      return;
    }
    el.innerHTML = `<div class="upcoming-list">${events.map(ev => `
      <div class="upc-row" onclick="quickAnalyze(${ev.home_id},${ev.away_id},'${ev.home}','${ev.away}')">
        <span class="upc-date">${ev.date}</span>
        <div class="upc-home"><img src="${ev.home_logo}" onerror="this.style.display='none'"> ${ev.home}</div>
        <span class="upc-vs">VS</span>
        <div class="upc-away"><img src="${ev.away_logo}" onerror="this.style.display='none'"> ${ev.away}</div>
        ${ev.score ? `<span class="score-badge">${ev.score}</span>` : ''}
      </div>`).join('')}
    </div>`;
  } catch(e) {
    el.innerHTML = `<div class="empty">Hata: ${e.message}</div>`;
  }
}

function quickAnalyze(homeId, awayId, homeName, awayName) {
  state.home = {id: homeId, name: homeName, shortName: homeName, logo: `${API.replace('/api','')}https://api.sofascore.com/api/v1/team/${homeId}/image`};
  state.away = {id: awayId, name: awayName, shortName: awayName, logo: `https://api.sofascore.com/api/v1/team/${awayId}/image`};
  document.getElementById('home-search').value = homeName;
  document.getElementById('away-search').value = awayName;
  state.home.logo = `https://api.sofascore.com/api/v1/team/${homeId}/image`;
  state.away.logo = `https://api.sofascore.com/api/v1/team/${awayId}/image`;
  updateVsBar();
  checkReady();
  switchTab('analyze');
  runAnalysis();
}

// ─── Live ─────────────────────────────────────────────────────────────────────
let liveInterval = null;

async function loadLive() {
  const el = document.getElementById('live-content');
  try {
    const res = await fetch(`${API}/api/live`);
    const events = await res.json();
    const liveCount = document.getElementById('live-count');
    if (!events.length) {
      el.innerHTML = '<div class="empty">Şu an canlı maç yok.</div>';
      liveCount.style.display = 'none';
      return;
    }
    liveCount.style.display = 'inline';
    el.innerHTML = `<div class="live-grid">${events.map(ev => {
      const hs = ev.home_score, as_ = ev.away_score;
      const scoreClass = hs > as_ ? 'home-ahead' : (as_ > hs ? 'away-ahead' : '');
      return `
        <div class="live-card" onclick="quickAnalyze(${ev.home_id},${ev.away_id},'${ev.home}','${ev.away}')" style="cursor:pointer">
          <div class="live-header">
            <span class="live-league">${ev.tournament}</span>
            <span class="live-min">${ev.minute}'</span>
          </div>
          <div class="live-teams">
            <div class="live-team"><img src="${ev.home_logo}" onerror="this.style.display='none'"> ${ev.home}</div>
            <div class="live-score ${scoreClass}">${hs} - ${as_}</div>
            <div class="live-team" style="justify-content:flex-end;text-align:right">${ev.away} <img src="${ev.away_logo}" onerror="this.style.display='none'"></div>
          </div>
        </div>`;
    }).join('')}</div>`;
  } catch(e) {
    el.innerHTML = `<div class="empty">Canlı veri alınamadı: ${e.message}</div>`;
  }
}

// Auto-refresh live every 60s when on live tab
setInterval(() => {
  if (document.getElementById('tab-live').style.display !== 'none') loadLive();
}, 60000);

// Initial live count check (silent)
setTimeout(async () => {
  try {
    const res = await fetch(`${API}/api/live`);
    const ev = await res.json();
    if (ev.length) document.getElementById('live-count').style.display = 'inline';
  } catch(e) {}
}, 2000);
</script>
